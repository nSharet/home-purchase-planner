<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מתכנן רכישת בית</title><meta name="description" content="מחשבון אינטראקטיבי לתכנון עלויות רכישת בית ומשכנתא"><link rel="stylesheet" href="src/styles.css"></head><body><header><h1>🏠 מתכנן רכישת בית</h1><p>מחיר, מסים, שיפוץ, הון עצמי ומשכנתא — בתרחיש אחד.</p></header><main><section class="panel controls"><h2>פרטי העסקה</h2><div id="inputs"></div><h3>הוצאות שיפוץ ועיצוב</h3><div id="renovations"></div><button id="addRenovation">＋ הוסף הוצאה</button><h3>מדרגות החזר חודשי</h3><div id="repaymentTiers"></div><button id="addTier">＋ הוסף מדרגה</button></section><section class="panel summary"><h2>סיכום</h2><div id="cards"></div><div id="warning"></div><h3>פירוט עלויות</h3><table><tbody id="breakdown"></tbody></table><div class="actions"><button id="save">שמור בדפדפן</button><button id="exportJson">ייצוא JSON</button><button id="exportCsv">ייצוא CSV</button><label class="import">ייבוא JSON<input id="importJson" type="file" accept="application/json"></label><button id="reset">איפוס</button></div></section></main><footer>החישוב הוא כלי תכנון בלבד. יש לאמת מס, מימון ועלויות מול אנשי המקצוע הרלוונטיים.</footer><script type="module" src="src/app.js"></script></body></html>
